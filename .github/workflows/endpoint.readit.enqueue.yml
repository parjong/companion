name: 'EP/readit/enqueue'

# Only register the URL in the INBOX project.
# Duplicates are handled, and the URL is processed, by parjong-org/kompa.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to enqueue'
        required: true
      # url/ END
    # inputs/ END
  # workflow_dispatch/ END
# on/ END

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # `gh project item-add` accepts only issue/PR URLs, so register the URL as a draft item.
      - name: 'Register url to the INBOX project'
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          INPUT_URL: ${{ github.event.inputs.url }}
        run: gh project item-create 1 --owner parjong-org --title "$INPUT_URL"
    # steps/ END
  # run/ END
# jobs/ END
